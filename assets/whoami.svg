chnology,</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="2.98s" fill="freeze"/><text x="24.0" y="227.0" fill="#d4dae3" font-size="14" textLength="33.6" lengthAdjust="spacingAndGlyphs">    </text><text x="57.6" y="227.0" fill="#d4dae3" font-size="14" textLength="420.0" lengthAdjust="spacingAndGlyphs">or better yet, in the technological future itself.</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="3.26s" fill="freeze"/><text x="24.0" y="273.0" fill="#7ee787" font-size="14" textLength="33.6" lengthAdjust="spacingAndGlyphs">[+] </text><text x="57.6" y="273.0" fill="#d4dae3" font-size="14" textLength="294.0" lengthAdjust="spacingAndGlyphs">What makes me happy is bringing my </text><text x="351.6" y="273.0" fill="#b4e3a1" font-size="14" textLength="109.2" lengthAdjust="spacingAndGlyphs">artistic side</text><text x="460.8" y="273.0" fill="#d4dae3" font-size="14" textLength="92.4" lengthAdjust="spacingAndGlyphs"> into code:</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="3.54s" fill="freeze"/><text x="24.0" y="296.0" fill="#d4dae3" font-size="14" textLength="33.6" lengthAdjust="spacingAndGlyphs">    </text><text x="57.6" y="296.0" fill="#d4dae3" font-size="14" textLength="344.4" lengthAdjust="spacingAndGlyphs">solutions that don&#x27;t just work, but also </text><text x="402.0" y="296.0" fill="#b4e3a1" font-size="14" textLength="58.8" lengthAdjust="spacingAndGlyphs">inspire</text><text x="460.8" y="296.0" fill="#d4dae3" font-size="14" textLength="8.4" lengthAdjust="spacingAndGlyphs">.</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="3.82s" fill="freeze"/><text x="24.0" y="342.0" fill="#e3b341" font-size="14" font-weight="700" textLength="33.6" lengthAdjust="spacingAndGlyphs">[!] </text><text x="57.6" y="342.0" fill="#7ee787" font-size="14" font-weight="700" textLength="58.8" lengthAdjust="spacingAndGlyphs">SUCCESS</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="4.50s" fill="