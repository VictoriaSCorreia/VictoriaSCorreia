<svg xmlns="http://www.w3.org/2000/svg" width="76" height="76" viewBox="0 0 76 76"><svg x="6" y="6" width="64" height="64" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#06090d"/><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" id="js-icon" x="3" y="3" width="58" height="58">
      <defs>
        <style>
          @keyframes stopper-ani {
            50% {
              transform: rotate(0);
            }
            60% {
              transform: rotate(-90deg);
            }
            90% {
              transform: rotate(-90deg);
            }
            100% {
              transform: rotate(0);
            }
          }
          @keyframes pool-ani {
            50% {
              transform: scale(0);
            }
            100% {
              transform: scale(1);
            }
          }
          @keyframes wave-ani {
            0% {
              x: 0px;
            }
            100% {
              x: -100px;
            }
          }

          @keyframes fill-ani {
            50% {
              y: 18px;
            }
            100% {
              y: 80px;
            }
          }

          #js-icon {
            
            
            
            
            
            
          }
          .js-cup {
            fill: transparent;
            stroke: #0276C6;
          }
          .js-text {
            font-size: 30px;
            font-weight: bold;
          }
          .js-stopper {
            transform-origin: 75px 65px;
            animation: stopper-ani 5s infinite;
          }
          .js-pool {
            transform: scale(0);
            transform-origin: 75px 75px;
            animation: pool-ani 5s infinite;
          }
          .wave-box {
            animation: wave-ani 5s infinite linear, fill-ani 5s infinite alternate;
          }
        </style>
        <pattern id="wave" width="0.1" height="1">
          <path
            fill=" #0276C6"
            d="M 0 10 C 3 12, 5 15, 14 10 C 17 9, 20 5, 30 10 L 30 60 L 0 60 z"
          />
        </pattern>
        <mask id="wave-mask">
          <rect x="25" y="25" width="50" height="50" fill="white"></rect>
        </mask>
      </defs>
      <ellipse class="js-pool" cx="75" cy="75" rx="25" ry="10" fill="#0276C6"></ellipse>
      <path class="js-cup" d="M 25 25 L 25 75 L 75 75 L 75 25 "></path>
      <g class="js-stopper">
        <rect x="75" y="65" width="1" height="5"></rect>
        <rect x="75" y="70" width="3" height="5"></rect>
      </g>
      <rect
        class="wave-box"
        mask="url(#wave-mask)"
        fill="url(#wave)"
        x="0"
        y="80"
        width="300"
        height="100"
      ></rect>
      <text class="js-text" x="40" y="70" fill="white">TS</text>
    </svg></svg></svg>